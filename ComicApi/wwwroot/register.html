<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký - ComicHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/site.css" rel="stylesheet">
</head>
<body>
    <div id="navbar"></div>

    <main class="container py-5">
        <div class="card auth-card mx-auto shadow-sm">
            <div class="card-body p-4">
                <h4 class="mb-4 text-center">Đăng ký tài khoản</h4>

                <div id="alertBox" class="alert alert-danger d-none"></div>

                <form id="registerForm" novalidate>
                    <div class="mb-3">
                        <label class="form-label" for="username">Tên đăng nhập</label>
                        <input class="form-control" id="username" name="username" maxlength="50" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="email">Email</label>
                        <input class="form-control" type="email" id="email" name="email" maxlength="100" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="password">Mật khẩu</label>
                        <input class="form-control" type="password" id="password" name="password" required>
                        <div class="form-text">Tối thiểu 6 ký tự</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="confirm">Nhập lại mật khẩu</label>
                        <input class="form-control" type="password" id="confirm" name="confirm" required>
                    </div>
                    <button class="btn btn-warning w-100" type="submit" id="submitBtn">Đăng ký</button>
                </form>

                <p class="text-center text-muted mt-3 mb-0">
                    Đã có tài khoản? <a href="login.html">Đăng nhập</a>
                </p>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/utils/auth.js"></script>
    <script src="js/api/client.js"></script>
    <script src="js/utils/ui.js"></script>
    <script src="js/pages/register.js"></script>
</body>
</html>
