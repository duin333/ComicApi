<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký - ComicHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/site.css" rel="stylesheet">
    <script src="/js/utils/theme.js"></script>
</head>
<body>
    <div id="navbar"></div>

    <main class="auth-page">
        <div class="container">
            <div class="auth-split">
                <aside class="auth-art">
                    <div class="auth-covers" aria-hidden="true">
                        <img src="/uploads/seed/covers/cover-07.jpg" alt="" onerror="this.remove()">
                        <img src="/uploads/seed/covers/cover-18.jpg" alt="" onerror="this.remove()">
                        <img src="/uploads/seed/covers/cover-30.jpg" alt="" onerror="this.remove()">
                    </div>
                    <div class="auth-art-text">
                        <h2>Tham gia cộng đồng</h2>
                        <p>Tạo tài khoản miễn phí để:</p>
                        <ul class="auth-perks">
                            <li>Theo dõi truyện yêu thích</li>
                            <li>Chấm sao và bình luận cùng độc giả khác</li>
                            <li>Lưu lịch sử đọc, đọc tiếp đúng chương dang dở</li>
                            <li>Hỏi chatbot gợi ý truyện hợp gu</li>
                        </ul>
                    </div>
                </aside>

                <section class="auth-form">
                    <div class="auth-card">
                        <h1 class="auth-title">Đăng ký</h1>
                        <p class="text-muted mb-4">Chỉ mất chưa đến một phút.</p>

                        <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

                        <form id="registerForm" novalidate>
                            <div class="form-floating mb-3">
                                <input class="form-control" id="username" name="username" maxlength="50"
                                       placeholder="Tên đăng nhập" autocomplete="username" required autofocus>
                                <label for="username">Tên đăng nhập</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input class="form-control" type="email" id="email" name="email" maxlength="100"
                                       placeholder="Email" autocomplete="email" required>
                                <label for="email">Email</label>
                            </div>
                            <div class="form-floating pw-wrap mb-3">
                                <input class="form-control" type="password" id="password" name="password"
                                       placeholder="Mật khẩu" autocomplete="new-password" required>
                                <label for="password">Mật khẩu (tối thiểu 6 ký tự)</label>
                                <button type="button" class="pw-toggle" data-target="password" aria-label="Hiện mật khẩu">Hiện</button>
                            </div>
                            <div class="pw-meter">
                                <div class="pw-bar"><span id="pwBar"></span></div>
                                <small id="pwLabel" class="text-muted"></small>
                            </div>
                            <div class="form-floating pw-wrap mb-4">
                                <input class="form-control" type="password" id="confirm" name="confirm"
                                       placeholder="Nhập lại mật khẩu" autocomplete="new-password" required>
                                <label for="confirm">Nhập lại mật khẩu</label>
                                <button type="button" class="pw-toggle" data-target="confirm" aria-label="Hiện mật khẩu">Hiện</button>
                            </div>
                            <button class="btn btn-brand btn-lg w-100" type="submit" id="submitBtn">Đăng ký</button>
                        </form>

                        <p class="text-center text-muted mt-4 mb-0">
                            Đã có tài khoản? <a href="/login.html">Đăng nhập</a>
                        </p>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/utils/auth.js"></script>
    <script src="js/api/client.js"></script>
    <script src="js/utils/ui.js"></script>
    <script src="js/pages/auth-ui.js"></script>
    <script src="js/pages/register.js"></script>
</body>
</html>
