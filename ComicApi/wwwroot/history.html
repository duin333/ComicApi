<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lịch sử đọc - ComicHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/site.css" rel="stylesheet">
</head>
<body>
    <div id="navbar"></div>

    <main class="container py-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <h4 class="section-title mb-0">
                Lịch sử đọc <small id="totalText" class="text-muted fs-6"></small>
            </h4>
            <button id="clearBtn" type="button" class="btn btn-sm btn-outline-danger d-none">Xóa toàn bộ lịch sử</button>
        </div>

        <div id="historyList" class="list-group shadow-sm"></div>
        <div id="pager" class="mt-4"></div>
    </main>

    <footer class="text-center text-muted small py-4">ComicHub - đồ án môn học</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/utils/auth.js"></script>
    <script src="js/api/client.js"></script>
    <script src="js/utils/ui.js"></script>
    <script src="js/pages/history.js"></script>
</body>
</html>
