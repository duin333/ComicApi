<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập - ComicHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/site.css" rel="stylesheet">
    <script src="/js/utils/theme.js"></script>
</head>
<body>
    <div id="navbar"></div>

    <main class="auth-page">
        <div class="container">
            <div class="auth-split">
                <aside class="auth-art">
                    <div class="auth-covers" aria-hidden="true">
                        <img src="/uploads/seed/covers/cover-03.jpg" alt="" onerror="this.remove()">
                        <img src="/uploads/seed/covers/cover-11.jpg" alt="" onerror="this.remove()">
                        <img src="/uploads/seed/covers/cover-24.jpg" alt="" onerror="this.remove()">
                    </div>
                    <div class="auth-art-text">
                        <h2>Chào mừng trở lại!</h2>
                        <p>Đăng nhập để đọc tiếp chương dang dở, xem truyện đang theo dõi và nhận gợi ý từ chatbot.</p>
                    </div>
                </aside>

                <section class="auth-form">
                    <div class="auth-card">
                        <h1 class="auth-title">Đăng nhập</h1>
                        <p class="text-muted mb-4">Nhập tài khoản của bạn để tiếp tục.</p>

                        <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

                        <form id="loginForm">
                            <div class="form-floating mb-3">
                                <input class="form-control" id="usernameOrEmail" name="usernameOrEmail"
                                       placeholder="Tên đăng nhập hoặc email" autocomplete="username" required autofocus>
                                <label for="usernameOrEmail">Tên đăng nhập hoặc email</label>
                            </div>
                            <div class="form-floating pw-wrap mb-4">
                                <input class="form-control" type="password" id="password" name="password"
                                       placeholder="Mật khẩu" autocomplete="current-password" required>
                                <label for="password">Mật khẩu</label>
                                <button type="button" class="pw-toggle" data-target="password" aria-label="Hiện mật khẩu">Hiện</button>
                            </div>
                            <button class="btn btn-brand btn-lg w-100" type="submit" id="submitBtn">Đăng nhập</button>
                        </form>

                        <p class="text-center text-muted mt-4 mb-0">
                            Chưa có tài khoản? <a href="/register.html">Đăng ký miễn phí</a>
                        </p>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/utils/auth.js"></script>
    <script src="js/api/client.js"></script>
    <script src="js/utils/ui.js"></script>
    <script src="js/pages/auth-ui.js"></script>
    <script src="js/pages/login.js"></script>
</body>
</html>
