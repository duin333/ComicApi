<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập - ComicHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/site.css" rel="stylesheet">
</head>
<body>
    <div id="navbar"></div>

    <main class="container py-5">
        <div class="card auth-card mx-auto shadow-sm">
            <div class="card-body p-4">
                <h4 class="mb-4 text-center">Đăng nhập</h4>

                <div id="alertBox" class="alert alert-danger d-none"></div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label" for="usernameOrEmail">Tên đăng nhập hoặc email</label>
                        <input class="form-control" id="usernameOrEmail" name="usernameOrEmail" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="password">Mật khẩu</label>
                        <input class="form-control" type="password" id="password" name="password" required>
                    </div>
                    <button class="btn btn-warning w-100" type="submit" id="submitBtn">Đăng nhập</button>
                </form>

                <p class="text-center text-muted mt-3 mb-0">
                    Chưa có tài khoản? <a href="register.html">Đăng ký</a>
                </p>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/utils/auth.js"></script>
    <script src="js/api/client.js"></script>
    <script src="js/utils/ui.js"></script>
    <script src="js/pages/login.js"></script>
</body>
</html>
