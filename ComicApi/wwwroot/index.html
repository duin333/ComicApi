<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ComicHub - Đọc truyện tranh online</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/site.css" rel="stylesheet">
    <script src="/js/utils/theme.js"></script>
</head>
<body>
    <div id="navbar"></div>

    <main>
        <!-- Chế độ trang chủ: banner, thể loại, các mục truyện -->
        <section id="heroSection" class="hero-wrap" aria-label="Truyện nổi bật"></section>

        <div class="container">
            <section id="genreSection" class="home-section">
                <div class="home-head">
                    <h2 class="section-title mb-0">Khám phá theo thể loại</h2>
                </div>
                <div id="genreTiles" class="genre-grid"></div>
            </section>

            <section id="hotSection" class="home-section">
                <div class="home-head">
                    <h2 class="section-title mb-0">Truyện hot</h2>
                    <a class="btn btn-pill-outline" href="/index.html?sort=views">Xem tất cả</a>
                </div>
                <div id="hotList" class="cx-grid"></div>
            </section>

            <section id="newSection" class="home-section">
                <div class="home-head">
                    <h2 class="section-title mb-0">Mới cập nhật</h2>
                    <a class="btn btn-pill-outline" href="/index.html?browse=1">Xem tất cả</a>
                </div>
                <div id="newList" class="cx-grid"></div>
            </section>

            <section id="topSection" class="home-section">
                <div class="home-head">
                    <h2 class="section-title mb-0">Đánh giá cao</h2>
                    <a class="btn btn-pill-outline" href="/index.html?sort=rating">Xem tất cả</a>
                </div>
                <div id="topList" class="cx-grid"></div>
            </section>

            <!-- Chế độ danh sách: khi tìm kiếm, lọc, sắp xếp hoặc bấm "Xem tất cả" -->
            <section id="browseSection" class="home-section d-none">
                <div class="home-head flex-wrap">
                    <h2 id="listHeading" class="section-title mb-0">Danh sách truyện</h2>
                    <div class="d-flex gap-2">
                        <select id="statusSelect" class="form-select form-select-sm" style="min-width: 11rem">
                            <option value="">Tất cả trạng thái</option>
                            <option value="Ongoing">Đang ra</option>
                            <option value="Completed">Hoàn thành</option>
                        </select>
                        <select id="sortSelect" class="form-select form-select-sm">
                            <option value="updated">Mới cập nhật</option>
                            <option value="newest">Mới đăng</option>
                            <option value="views">Xem nhiều</option>
                            <option value="rating">Đánh giá cao</option>
                            <option value="follows">Theo dõi nhiều</option>
                            <option value="title">Tên A-Z</option>
                        </select>
                    </div>
                </div>

                <div id="genrePills" class="genre-pills mb-3"></div>
                <div id="listCount" class="text-muted small mb-3"></div>

                <div id="comicList" class="cx-grid"></div>
                <div id="pager" class="mt-4"></div>
            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/utils/auth.js"></script>
    <script src="js/api/client.js"></script>
    <script src="js/utils/ui.js"></script>
    <script src="js/pages/home.js"></script>
</body>
</html>
