<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ComicHub - Đọc truyện tranh online</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/site.css" rel="stylesheet">
</head>
<body>
    <div id="navbar"></div>

    <main class="container py-4">

        <!-- Truyện hot (ẩn khi đang tìm kiếm hoặc lọc) -->
        <section id="hotSection" class="mb-5">
            <h4 class="section-title mb-3">Truyện hot</h4>
            <div id="hotList" class="row row-cols-2 row-cols-md-4 row-cols-lg-6 g-3"></div>
        </section>

        <!-- Danh sách chính -->
        <section>
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                <h4 id="listHeading" class="section-title mb-0">Mới cập nhật</h4>
                <div class="d-flex gap-2">
                    <select id="statusSelect" class="form-select form-select-sm" style="min-width: 11rem">
                        <option value="">Tất cả trạng thái</option>
                        <option value="Ongoing">Đang ra</option>
                        <option value="Completed">Hoàn thành</option>
                    </select>
                    <select id="sortSelect" class="form-select form-select-sm">
                        <option value="updated">Mới cập nhật</option>
                        <option value="newest">Mới đăng</option>
                        <option value="views">Xem nhiều</option>
                        <option value="title">Tên A-Z</option>
                    </select>
                </div>
            </div>

            <div id="genrePills" class="genre-pills mb-3"></div>
            <div id="listCount" class="text-muted small mb-2"></div>

            <div id="comicList" class="row row-cols-2 row-cols-md-4 row-cols-lg-6 g-3"></div>
            <div id="pager" class="mt-4"></div>
        </section>
    </main>

    <footer class="text-center text-muted small py-4">ComicHub - đồ án môn học</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/utils/auth.js"></script>
    <script src="js/api/client.js"></script>
    <script src="js/utils/ui.js"></script>
    <script src="js/pages/home.js"></script>
</body>
</html>
