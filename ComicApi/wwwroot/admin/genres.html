<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý thể loại - ComicHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/site.css" rel="stylesheet">
</head>
<body>
    <div id="navbar"></div>

    <main class="container py-4" id="adminRoot">
        <div id="adminNav"></div>

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <h4 class="section-title mb-0">Quản lý thể loại <small id="totalText" class="text-muted fs-6"></small></h4>
            <button id="addBtn" type="button" class="btn btn-sm btn-warning">+ Thêm thể loại</button>
        </div>

        <div class="card border-0 shadow-sm" style="max-width: 640px">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th style="width: 70px">#</th>
                        <th>Tên thể loại</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="genreRows"></tbody>
            </table>
        </div>
    </main>

    <!-- Hộp thoại thêm / sửa thể loại -->
    <div class="modal fade" id="genreModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <form class="modal-content" id="genreForm" novalidate>
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Thêm thể loại</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="formAlert" class="alert alert-danger d-none"></div>
                    <label class="form-label" for="genreName">Tên thể loại *</label>
                    <input class="form-control" id="genreName" maxlength="50" required>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="submit" class="btn btn-warning" id="saveBtn">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/utils/auth.js"></script>
    <script src="/js/api/client.js"></script>
    <script src="/js/utils/ui.js"></script>
    <script src="/js/utils/admin.js"></script>
    <script src="/js/pages/admin-genres.js"></script>
</body>
</html>
