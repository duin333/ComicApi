<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý người dùng - ComicHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/site.css" rel="stylesheet">
</head>
<body>
    <div id="navbar"></div>

    <main class="container py-4" id="adminRoot">
        <div id="adminNav"></div>

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <h4 class="section-title mb-0">Quản lý người dùng <small id="totalText" class="text-muted fs-6"></small></h4>
            <form id="searchForm" class="d-flex gap-2">
                <input id="searchInput" class="form-control form-control-sm" placeholder="Tìm theo tên hoặc email">
                <button class="btn btn-sm btn-outline-secondary" type="submit">Tìm</button>
            </form>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th>Tên đăng nhập</th>
                            <th>Email</th>
                            <th>Vai trò</th>
                            <th>Trạng thái</th>
                            <th>Ngày tạo</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="userRows"></tbody>
                </table>
            </div>
        </div>
        <div id="pager" class="mt-3"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/utils/auth.js"></script>
    <script src="/js/api/client.js"></script>
    <script src="/js/utils/ui.js"></script>
    <script src="/js/utils/admin.js"></script>
    <script src="/js/pages/admin-users.js"></script>
</body>
</html>
