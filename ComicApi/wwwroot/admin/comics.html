<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý truyện - ComicHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/site.css" rel="stylesheet">
</head>
<body>
    <div id="navbar"></div>

    <main class="container py-4" id="adminRoot">
        <div id="adminNav"></div>

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <h4 class="section-title mb-0">Quản lý truyện <small id="totalText" class="text-muted fs-6"></small></h4>
            <div class="d-flex gap-2">
                <form id="searchForm" class="d-flex gap-2">
                    <input id="searchInput" class="form-control form-control-sm" placeholder="Tìm theo tên hoặc tác giả">
                    <button class="btn btn-sm btn-outline-secondary" type="submit">Tìm</button>
                </form>
                <button id="addBtn" type="button" class="btn btn-sm btn-warning">+ Thêm truyện</button>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Bìa</th>
                            <th>Truyện</th>
                            <th>Thể loại</th>
                            <th>Trạng thái</th>
                            <th>Chương</th>
                            <th class="text-end">Lượt xem</th>
                            <th>Cập nhật</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="comicRows"></tbody>
                </table>
            </div>
        </div>
        <div id="pager" class="mt-3"></div>
    </main>

    <!-- Hộp thoại thêm / sửa truyện -->
    <div class="modal fade" id="comicModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <form class="modal-content" id="comicForm" novalidate>
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Thêm truyện</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <div id="formAlert" class="alert alert-danger d-none"></div>

                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Ảnh bìa</label>
                            <div class="cover-wrap rounded mb-2">
                                <img id="coverPreview" alt="Ảnh bìa">
                            </div>
                            <input type="file" id="coverFile" class="form-control form-control-sm"
                                   accept="image/jpeg,image/png,image/webp,image/gif">
                            <div class="form-text">jpg, png, webp, gif, tối đa 2 MB</div>
                        </div>

                        <div class="col-md-8">
                            <div class="mb-3">
                                <label class="form-label" for="title">Tên truyện *</label>
                                <input class="form-control" id="title" name="title" maxlength="200" required>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-sm-7">
                                    <label class="form-label" for="author">Tác giả</label>
                                    <input class="form-control" id="author" name="author" maxlength="100">
                                </div>
                                <div class="col-sm-5">
                                    <label class="form-label" for="status">Trạng thái</label>
                                    <select class="form-select" id="status" name="status">
                                        <option value="Ongoing">Đang ra</option>
                                        <option value="Completed">Hoàn thành</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Thể loại</label>
                                <div id="genreChecks" class="d-flex flex-wrap gap-2"></div>
                            </div>

                            <div>
                                <label class="form-label" for="description">Mô tả</label>
                                <textarea class="form-control" id="description" name="description" rows="5" maxlength="4000"></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="submit" class="btn btn-warning" id="saveBtn">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/utils/auth.js"></script>
    <script src="/js/api/client.js"></script>
    <script src="/js/utils/ui.js"></script>
    <script src="/js/utils/admin.js"></script>
    <script src="/js/pages/admin-comics.js"></script>
</body>
</html>
